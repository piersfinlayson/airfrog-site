# Airfrog's schema
#
# The source of AWP's constants and layouts, the page texts and Airfrog's
# project name. AWP is specified in airfrog-v2/docs/websocket-protocol.md.
# ci/schema.py generates from it:
# - airfrog-site's js/schema.js: constants and each layout's encoder and
#   decoder
# - airfrog-site's js/messages.js: the page texts
# - airfrog-v2's components/protocol/airfrog_awp.h, the public AWP header:
#   constants and layout offsets
# - airfrog-v2's components/protocol/airfrog_image.h: the constants of
#   Airfrog's firmware images
# - airfrog-v2's rust/airfrog-ext-api/src/awp.rs: constants, a type for each
#   enum and layout offsets
# - airfrog-v2's rust/airfrog-client/src/schema.rs: constants, the types
#   airfrog-client exports, layout offsets and AirfrogError's texts
# - airfrog-v2's ci/awp.py: constants and layout offsets
# - airfrog-v2's rust/picoboot-airfrog/src/text.rs: its error texts
# - airfrog-v2's apps/airfrog/schema.cmake: the project name, the frame hosts,
#   the release keys and the Airfrog manifest's address
# - airfrog-v2's apps/airfrog/main/page-texts.js: Airfrog's home page's texts
# - airfrog-v2's components/protocol/airfrog_recovery.h: [recovery_constants]
# - airfrog-v2's rust/airfrog-cli/src/schema.rs: the firmware image
#   constants, the released models, the chips, the target firmware names,
#   the release keys from commissioning/release-keys.js, [client_constants],
#   [recovery_constants] and [cli_output]
# - airfrog-v2's rust/airfrog-signing-server/src/models.rs:
#   manifest_version, the firmware manifests' keys, the project name, the
#   model numbers and the extension image header
#
# `ci/schema.py check v2` also fails when websocket-protocol.md's message,
# command, ERROR code, firmware ID, close code, service, operation or layout
# tables differ from the schema, or when recovery-protocol.md's request header
# and result tables differ from [recovery_constants].
#
# After a change here, use `ci/schema.py write site` and
# `ci/schema.py write v2 ../airfrog-v2`.
#
# ---------------------------------------------------------------------------
# Names
# ---------------------------------------------------------------------------
# Each entry's key is its name. The C name has the prefix AF_, the Rust, JS
# and Python names don't. An entry's `c`, `rust`, `js` or `py` is its name in
# that language in place of the default, or false to leave it out of that
# language. Python has a const each, with the enum's prefix.
#
# ---------------------------------------------------------------------------
# [constants]
# ---------------------------------------------------------------------------
#   value    - a number or a string
#   type     - the Rust type: u8, u16, u32, usize or str
#   hex      - written in hex
#   comment  - the comment in each language
#   image    - true for a constant of Airfrog's firmware images, which isn't
#              AWP's. It is in airfrog_image.h in place of airfrog_awp.h, in
#              airfrog-cli, and not in airfrog-ext-api.
#
# ---------------------------------------------------------------------------
# [client_constants]
# ---------------------------------------------------------------------------
# Values of Airfrog's pages and CLI that aren't AWP's, with [constants]'s
# value, type and comment. JS's schema.js, Airfrog's home page's texts and
# airfrog-cli's schema.rs have them. `client = true` also writes one into
# airfrog-client's schema.rs.
#
# ---------------------------------------------------------------------------
# [enums.NAME]
# ---------------------------------------------------------------------------
#   prefix   - the prefix of each value's name in airfrog-client's schema
#              module, JS's exported consts and Python
#   c_prefix - the prefix of each value's name in C, after AF_. No enum's
#              c_prefix is the start of another's.
#   c_enum   - true for a C typedef enum. Its name is af_, then c_prefix in
#              lower case without its last _, then _t.
#              Without it, a #define each.
#   type     - the values' type in Rust and JS. airfrog-ext-api has a tuple
#              struct of this name with an associated const each, ALL and
#              name().
#   rust     - Rust: { type } is the integer in `type`'s struct, u16 without
#              it. airfrog-client has a const each in its schema module, or
#              with { public = true } exports the same struct as
#              airfrog-ext-api.
#   js       - JS: { object = true } for a frozen object named `type`.
#              Without it, an exported const each. { list } also exports a
#              frozen array of every value with that name, and { names } a
#              function with that name that returns a value's name.
#   hex      - values written in hex
#   values   - each value's `value`, or `bit` for 1 << bit, and `comment`.
#              A close code's `doc` is its name in the spec's table, when it
#              isn't its key in words.
#
# ---------------------------------------------------------------------------
# [layouts.NAME]
# ---------------------------------------------------------------------------
# A message's or entry's fields in order, without padding, little-endian. A
# layout's fixed part ends at its first field without a fixed size. C, Rust
# and JS get NAME_FIELD_OFFSET for each named field in the fixed part. When
# the fixed part isn't empty they also get NAME_LEN, its length, or NAME_HEAD
# when other fields follow. `len` or `head` is that constant's name in place
# of the default, and `prefix` is NAME in every language. JS also gets
# encodeNAME() and decodeNAME() with NAME in CamelCase. A reserved field is
# named only for its offset. JS's codec skips it.
#
# `doc` is the spec's heading above the layout's table, and `doc_table` the
# table's number under it, 1 by default. `doc = false` for a layout without a
# table.
#
# Field types:
#   u8, i8, u16, u32, u64
#   bytes     - `size` bytes. `size` is a number or a constant's name.
#   padded    - ASCII text padded with zero bytes to `size` bytes
#   reserved  - `size` bytes sent as 0
#   text      - a 2-byte length, then that many bytes of UTF-8
#   layout    - the `entry` layout
#   variable  - a 2-byte length, then that many bytes of `entry` layouts
#   list      - `count` entries, where `count` is an earlier field. Each entry
#               is the `entry` layout, or a `text`, `u16` or `u32` field.
#   rest      - bytes to the end of the message
#
# `optional` on a layout's last fields: decode() reads them as null, or skips
# a reserved field, when the message ends before them.
#
# `max` on a u8, u16 or u32 field: JS also gets NAME_FIELD_MAX, its largest
# value.
#
# ---------------------------------------------------------------------------
# [services.NAME]
# ---------------------------------------------------------------------------
# The service IDs are an enum, with [enums.NAME]'s keys. `operation_type`
# is the operation IDs' type in Rust and JS. `messages_comment` is the
# comment above js/messages.js's SERVICES. Each service has:
#   value        - the service ID
#   description  - js/messages.js's description
#   operations   - each operation's ID: AF_OP_SERVICE_NAME in C and
#                  SERVICE_NAME in Rust's and JS's operation type. `all` is
#                  ALL, every operation of a service.
#
# ---------------------------------------------------------------------------
# [target_mcus.NAME]
# ---------------------------------------------------------------------------
# Each target MCU Airfrog's rules identify, by TARGET's targetid: its designer,
# bits 1 to 11, and its part, bits 12 to 27. NAME is the MCU's name. JS gets
# TARGET_MCUS.
#   designer - the designer
#   parts    - each part
#
# ---------------------------------------------------------------------------
# [chips.NAME]
# ---------------------------------------------------------------------------
# Each ESP32 an Airfrog model is built on. JS gets CHIPS, Python CHIPS and
# CHIP_NAMES.
#   value   - GET_HW_INFO's chip, the chip ID in an ESP-IDF image header
#   name    - the MCU's name
#   target  - ESP-IDF's target
#   psram   - true for an MCU that may have PSRAM
#
# ---------------------------------------------------------------------------
# [[cli_targets]]
# ---------------------------------------------------------------------------
# Each architecture the Airfrog CLI is released for, in the order airfrog.org/cli
# displays them. JS gets CLI_TARGETS, Rust CLI_TARGETS, and
# ci/release-cli.py reads them.
#   target    - the Rust target, its key in the CLI manifest. macOS's file runs
#               on both of its architectures
#   platform  - the name airfrog.org/cli displays
#   os        - Rust's std::env::consts::OS
#   arch      - Rust's std::env::consts::ARCH, "" for any
#   files     - the words that identify a file, each a list whose first item
#               is the extension
#
# ---------------------------------------------------------------------------
# [[models]]
# ---------------------------------------------------------------------------
# Each Airfrog model. GET_HW_INFO reports a model's number, and each
# firmware image contains it at IMAGE_MODEL_OFFSET. The firmware is built
# for a model, on its chip's ESP-IDF target.
#   value     - the model's number
#   name      - its name, displayed as written: words of letters and digits
#               between single spaces, the first starting with a letter, for
#               example "Mini v2"
#   chip      - its [chips] entry
#   released  - false until the model is released. An unreleased model's
#               name is written only here and in what the firmware build
#               generates from it. js/schema.js has its number and chip,
#               and airfrog-cli's schema.rs its number. Rust's model names
#               and the release scripts leave it out, and
#               `ci/schema.py check names` fails when a file contains it
#               after "airfrog" and a hyphen, underscore or space.
#
# A model's key is its name in lower case with each space a hyphen
# (mini-v2). It is the model's key in the firmware manifest, in its release
# files' names and its build directories, and the build scripts' argument.
# Its constants are its name in upper case with each space an underscore
# (MINI_V2). ci/schema.py derives both. `ci/schema.py model KEY` provides a
# model's details to the build.
#
# ---------------------------------------------------------------------------
# [messages.NAME]
# ---------------------------------------------------------------------------
# js/messages.js, in this order. A message is a `text`, or `entries`, an
# object of texts.
#   comment    - the comment above it
#   export     - false for a text only other texts refer to
#   keys       - "errors": each entry's key is an ERROR code's name, written
#                as its number
#   functions  - every entry is a function
#   page       - its entries are also on Airfrog's home page, index.html, which
#                the firmware build writes them into as @PAGE_TEXTS@. Texts
#                and args only.
#
# A text is a string, or a table of:
#   text       - the string
#   args       - the function's arguments. A text with args is a function.
#   linked     - the function returns a LinkedText, with the link at {url}
#   cases      - texts in place of `text` for the first argument: `is` a
#                number, `absent` when null or undefined, `falsy` when false,
#                0, empty, null or undefined. `text` is the last case.
#   lookup     - a message with `keys`. Its entry for the first argument, when
#                it has one, in place of `text`.
#   comment    - the comment above it
# {NAME} in a string is an argument, another message, for example
# {CLOSED.PASSWORD_CHANGED}, or the value of a constant or a client constant.
#
# `rust = true` on a message also generates its entries in schema.rs's `text`
# module, a const for a text without arguments, otherwise a function.
# `rust = "picoboot-airfrog"` generates them in that crate's src/text.rs.
# `rust_args` are the function's argument types. [rust_texts] are texts only
# airfrog-client displays, in the same form.
#
# ---------------------------------------------------------------------------
# [recovery_constants]
# ---------------------------------------------------------------------------
# Values of the recovery protocol and One ROM's recovery and serial firmware,
# and the support firmware manifest's keys, in airfrog-cli's schema.rs as its
# recovery module and in airfrog_recovery.h with the prefix AF_RECOVERY_, with
# [constants]'s value, type, hex and comment. `c = false` leaves one out of
# airfrog_recovery.h. `support_firmware = true` marks a key of the support
# firmware manifest.
#
# ---------------------------------------------------------------------------
# [cli_output.GROUP]
# ---------------------------------------------------------------------------
# The airfrog CLI's output, in airfrog-cli's schema.rs as text::group, one
# module a group. Each entry has [messages]'s form, with rust_args.

project = "airfrog"
# The version of every Airfrog manifest's schema, its `version`. It is raised
# only by a breaking change. ci/signing.py and the signing server use it.
manifest_version = 1

[constants]
REVISION = { value = 1, type = "u16", comment = "The AWP revision Airfrog implements." }
SUBPROTOCOL = { value = "airfrog-v1", type = "str", comment = "The WebSocket subprotocol." }
PATH = { value = "/api/ws", type = "str", c = "AF_WS_PATH", comment = "The WebSocket's path." }
NONCE_LEN = { value = 16, type = "usize", comment = "ns and nc." }
KEY_LEN = { value = 32, type = "usize", comment = "K, the password's key." }
SALT_LEN = { value = 16, type = "usize" }
PROOF_LEN = { value = 32, type = "usize", comment = "LOGIN's proof." }
HMAC_LEN = { value = 32, type = "usize", c = false }
LOGIN_LABEL = { value = "login", type = "str", comment = "The label of the client's proof in LOGIN." }
PROOF_LABEL = { value = "airfrog", type = "str", comment = "The label of Airfrog's proof in LOGIN's response." }
SESSION_LABEL = { value = "session", type = "str", comment = "The label of S, the connection's key." }
PASSWORD_LABEL = { value = "password", type = "str", comment = "The label of the pad that encrypts SET_PASSWORD's key on a logged-in connection." }
SIGNATURE_LEN = { value = 74, type = "usize", comment = "A signature: Ed, the key ID and the Ed25519 signature." }
DIRECTION_CLIENT = { value = 0x00, type = "u8", hex = true, rust = "FROM_CLIENT", comment = "The hmac's direction byte on a message from the client." }
DIRECTION_AIRFROG = { value = 0x01, type = "u8", hex = true, rust = "FROM_AIRFROG", comment = "The hmac's direction byte on a message from Airfrog." }
PICOBOOT_PACKET_LEN = { value = 32, type = "usize", comment = "A PICOBOOT command packet." }
PICOBOOT_STATUS_LEN = { value = 16, type = "usize", comment = "PICOBOOT's command status." }
RBCP_HEADER_LEN = { value = 8, type = "usize", comment = "An RBCP response header." }
PIN_NAME_LEN = { value = 8, type = "usize", comment = "A pin field." }
SERIAL_NUMBER_LEN = { value = 16, type = "usize", comment = "GET_HW_INFO's serial number." }
IMAGE_MODEL_OFFSET = { value = 288, type = "usize", image = true, rust = false, comment = "The offset of a firmware image's model number, a u16 after esp_app_desc_t." }
SSID_MAX = { value = 32, type = "usize" }
WIFI_PASSWORD_MIN = { value = 8, type = "usize" }
WIFI_PASSWORD_MAX = { value = 63, type = "usize" }
HOSTNAME_MAX = { value = 63, type = "usize" }
HOST_ALIASES_MAX = { value = 4, type = "usize" }
HOST_ALIAS_MAX = { value = 253, type = "usize" }
LABEL_MAX = { value = 63, type = "usize", comment = "A label of a host alias." }
AUTHORISED_WEBSITES_MAX = { value = 8, type = "usize" }
AUTHORISED_WEBSITE_MAX = { value = 267, type = "usize", comment = "https://, a host of HOST_ALIAS_MAX bytes and :65535." }
BOOT_WINDOW_MAX_MS = { value = 10000, type = "u16" }
BOOT_WINDOW_AUTO = { value = 0xFFFF, type = "u16", hex = true, comment = "SET_SETTINGS's boot window for the longest of any supported firmware." }
RESCAN_MIN_S = { value = 60, type = "u32", comment = "The shortest rescan interval other than 0, which turns rescans off." }
RESCAN_DEFAULT_S = { value = 3600, type = "u32" }
RESCAN_DB_MAX = { value = 100, type = "u16" }
RESCAN_DEFAULT_DB = { value = 10, type = "u16" }
RESTART_TIMEOUT_DEFAULT_MS = { value = 60000, type = "u32", comment = "A graceful RESTART's timeout_ms when it is 0." }
RESTART_TIMEOUT_MAX_MS = { value = 600000, type = "u32" }
SCAN_MAX = { value = 20, type = "usize", comment = "The most networks WIFI_SCAN lists." }
SERIAL_PREFIX = { value = "@af ", type = "str", comment = "The start of a message line over serial." }
SERIAL_LINE_MAX = { value = 8192, type = "usize", comment = "The longest line Airfrog reads over serial." }
CLAIM_MS = { value = 10000, type = "u32", comment = "The claim ends this long after the response to its holder's last CLAIM, IDENTIFY or TARGET_CMD." }
MAX_TRANSFER_MIN = { value = 4096, type = "usize", comment = "The smallest HELLO max_transfer, and the most data in EXT_CMD and EXT_NOTIFY." }
EXT_IMAGE_MAGIC = { value = "AFXI", type = "str", comment = "The start of an extension image." }
SIGNATURE_MAGIC = { value = "AFSG", type = "str", image = true, comment = "The start of the signature block after a signed file's image." }
EXTENSIONS_MAX = { value = 16, type = "usize", comment = "Installed extensions." }
EXT_NAME_MAX = { value = 32, type = "usize", comment = "An extension name." }
EXT_METADATA_MAX = { value = 2048, type = "usize", comment = "An extension's metadata." }
INSTALL_MS = { value = 10000, type = "u32", comment = "An extension install, or a firmware update past the button AP's 5 minutes, ends this long after its last BEGIN or WRITE." }
BUTTON_HOLD_S = { value = 3, type = "u32", comment = "How long the recovery button is held, while Airfrog runs, to start the access point." }
BUTTON_AP_MIN = { value = 5, type = "u32", comment = "How long the access point started with the recovery button lasts, in minutes." }

[client_constants]
DOWNLOAD_TIMEOUT_MS = { value = 15000, type = "u64", comment = "A download that receives nothing for this long fails." }
MIN_ITERATIONS = { value = 100000, type = "u32", client = true, comment = "Clients don't log in when HELLO's iterations is lower." }
PASSWORD_MIN = { value = 8, type = "usize", comment = "The shortest Airfrog password a client sets." }

